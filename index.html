<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <title>Places In Japan I Have Been To</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <!-- Mapbox -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #container {
            height: 100vh;
            flex-direction: row;
            align-items: stretch;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: 0;
        }
        #side-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 400px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
            z-index: 10;
        }

        button {
            margin-bottom: 10px;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
            border: 1px solid #ddd;
        }

        th,
        td {
            text-align: left;
            padding: 16px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        @media (max-width: 1024px) {
            #side-panel {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main id="container">
        <div id="side-panel">
            <h2>List of Visited Places in Japan</h2>
            <button>Sort by Rating</button>

            <table>
                <tr>
                    <th>Rating</th>
                    <th>Location</th>
                    <th>Year Visited</th>
                </tr>
            </table>
        </div>
        <div id="map"></div>
    </main>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoia2VuYXR2IiwiYSI6ImNtaGF4b2YwOTA3MnkycW9hbHMzY3R0YjEifQ.Pnh4mKoZc4eEtnDHXxD7Dg'; 
        
        let map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            zoom: 5.5,
            center: [138, 38]
        });
        
        async function geojsonFetch() {
            let response, visited, japan;
            response = await fetch('asset/visited.geojson');
            visited = await response.json();
            response = await fetch('asset/japan.json');
            japan = await response.json();
            map.on('load', function () {
        
                map.addSource('visited', {
                    type: 'geojson',
                    data: visited
                });
        
                map.addLayer({
                    'id': 'visited-layer',
                    'type': 'circle',
                    'source': 'visited',
                    'paint': {
                        'circle-radius': 8,
                        'circle-stroke-width': 2,
                        'circle-color': 'red',
                        'circle-stroke-color': 'white'
                    }
                });
        
                map.addSource('japan', {
                    type: 'geojson',
                    data: japan
                });
        
                map.addLayer({
                    'id': 'japan-layer',
                    'type': 'fill',
                    'source': 'japan',
                    'paint': {
                        'fill-color': "#00BFFF",
                        'fill-opacity': 0.5
                    }
                });
            });
    
            let table = document.getElementsByTagName("table")[0];
            let row, cell1, cell2, cell3;
        
            for (let i = 0; i < visited.features.length; i++) {
                row = table.insertRow(-1);
                cell1 = row.insertCell(0);
                cell2 = row.insertCell(1);
                cell3 = row.insertCell(2);
                cell1.innerHTML = visited.features[i].properties.Rating;
                cell2.innerHTML = visited.features[i].properties.location;
                cell3.innerHTML = visited.features[i].properties.year;
            }
        
            let btn = document.getElementsByTagName("button")[0];
            btn.addEventListener('click', sortTable);
        
            function sortTable() {
                let table = document.getElementsByTagName("table")[0];
                let switching = true;
                let shouldSwitch, rows, x, y, i;

                while (switching) {
                    switching = false;
                    rows = table.rows;

                    for (i = 1; i < (rows.length - 1); i++) {
                        shouldSwitch = false;
                        // Compare Rating column (index 0)
                        x = parseFloat(rows[i].getElementsByTagName("td")[0].innerHTML);
                        y = parseFloat(rows[i + 1].getElementsByTagName("td")[0].innerHTML);
                        if (x < y) { // descending order
                            shouldSwitch = true;
                            break;
                        }
                    }
                    if (shouldSwitch) {
                        rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                        switching = true;
                    }
                }
            }

        }
        
        geojsonFetch();
        </script>
        
</body>
</html>
